name: Build Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yalla-nrouh-android-build
  cancel-in-progress: true

jobs:
  android-apk:
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_GOOGLE_ROUTES_PROXY: ${{ vars.GOOGLE_ROUTES_PROXY_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pexpo.useLegacyPackaging=true --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-nrouh-android-unified-test
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest Android test APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          mkdir -p release-apk
          cp "$APK" release-apk/yalla-nrouh-test.apk
          if ! gh release view android-test-unified >/dev/null 2>&1; then
            gh release create android-test-unified --title "Yalla Nrouh Android test (latest)" --notes "Test build only; not a live taxi booking service." --prerelease
          fi
          gh release upload android-test-unified release-apk/yalla-nrouh-test.apk --clobber
