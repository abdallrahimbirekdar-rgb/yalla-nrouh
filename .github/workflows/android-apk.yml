# Rebuild request: Android 0.9.1 foreground GPS fixes, re-publish verified test APK.
name: Build Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'app.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'eas.json'
      - 'plugins/**'
      - 'assets/app-icon-approved.png'
      - 'assets/adaptive-approved.png'
      - 'assets/monochrome-approved.png'
      - 'assets/logo-approved.png'
      - 'src/site-shell.tsx'
      - 'src/android-fresh/**'
      - 'src/position-jobs.ts'
      - 'src/foreground-fix.ts'
      - 'src/current-position.ts'
      - 'src/site-shell-policy.ts'
      - 'src/site-bridge.ts'
      - 'src/permissions-intro.tsx'
      - 'src/alerts.ts'
      - 'src/storage.ts'
      - 'src/app/index.tsx'
      - 'src/app/_layout.tsx'
      - 'scripts/patch-gradle-resolver.cjs'
      - 'scripts/trim-symbol-font-loader.cjs'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      require_google_maps:
        description: 'Require Google Maps SDK key (fail build instead of OSM fallback)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yalla-nrouh-android-build
  cancel-in-progress: true

jobs:
  android-apk:
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      EXPO_PUBLIC_GOOGLE_ROUTES_PROXY: ${{ vars.GOOGLE_ROUTES_PROXY_URL }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck app and server beta
        run: npm run typecheck
      - name: Test booking and network client
        run: npm test
      - name: Generate Android project
        env:
          YALLA_FIREBASE_ANDROID_CONFIG: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [[ -n "${YALLA_FIREBASE_ANDROID_CONFIG:-}" ]]; then
            export YALLA_GOOGLE_SERVICES_FILE="$RUNNER_TEMP/yalla-google-services.json"
            printf '%s' "$YALLA_FIREBASE_ANDROID_CONFIG" > "$YALLA_GOOGLE_SERVICES_FILE"
            printf 'YALLA_GOOGLE_SERVICES_FILE=%s\n' "$YALLA_GOOGLE_SERVICES_FILE" >> "$GITHUB_ENV"
          fi
          npx expo prebuild --platform android --no-install
      - name: Check embedded Google Maps configuration
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_MAPS_ANDROID_API_KEY:-}" ]]; then
            echo "::error title=Missing Google Maps key::Add GOOGLE_MAPS_ANDROID_API_KEY in GitHub repository Actions secrets. Google Maps is required on both platforms."
            exit 1
          else
            if ! grep -q 'com.google.android.geo.API_KEY' android/app/src/main/AndroidManifest.xml; then
              echo "::error::Google Maps key was provided but not inserted into the Android manifest."
              exit 1
            fi
            echo "### Google Maps: configured in Android manifest" >> "$GITHUB_STEP_SUMMARY"
            echo "Maps SDK must also be enabled in Google Cloud; test map tiles on an Android phone." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build test APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a -Pexpo.useLegacyPackaging=true --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2
      - name: Verify compiled APK and Android version
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -name '*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          APK="${APKS[0]}"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signing.txt
          CERT_SHA1=$(sed -n 's/^Signer #1 certificate SHA-1 digest: //p' apk-signing.txt | head -n 1)
          if [[ ! "$CERT_SHA1" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Could not read APK signing certificate SHA-1."
            exit 1
          fi
          FORMATTED_SHA1=$(printf '%s' "$CERT_SHA1" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -F "package: name='com.yallanrouh.demo' versionCode='$APP_CODE' versionName='$APP_VERSION'" apk-badging.txt
          sha256sum "$APK" | tee apk-build-sha256.txt
          echo "Android package: \`com.yallanrouh.demo\`" >> "$GITHUB_STEP_SUMMARY"
          echo "APK signing certificate SHA-1: \`$FORMATTED_SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "This is a test APK signed with Android Debug; use a production signing certificate before release." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: yalla-nrouh-android-unified-test
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified Android test APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find android/app/build/outputs/apk/release -name '*.apk' -type f)
          test "${#APKS[@]}" -eq 1
          mkdir -p release-apk
          cp "${APKS[0]}" release-apk/yalla-nrouh-test.apk
          (cd release-apk && sha256sum yalla-nrouh-test.apk > yalla-nrouh-test.apk.sha256)
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APP_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          MAPS_STATUS="Clean Android 1.0.0 native foreground GPS host, live Google Maps website, and website UI updates without another APK."
          if ! gh release view android-test-unified >/dev/null 2>&1; then
            gh release create android-test-unified --title "Yalla Nrouh Android $APP_VERSION (test)" --notes "Test build only; not a live taxi booking service." --prerelease
          fi
          gh release upload android-test-unified release-apk/yalla-nrouh-test.apk release-apk/yalla-nrouh-test.apk.sha256 --clobber
          printf 'Android test %s, versionCode %s.\nSource commit: %s\n%s\nBuilt via GitHub Actions after automated checks and APK signature verification.\nTest only; not a live taxi booking service.\n' "$APP_VERSION" "$APP_CODE" "$GITHUB_SHA" "$MAPS_STATUS" > release-notes.txt
          gh release edit android-test-unified --title "Yalla Nrouh Android $APP_VERSION (test)" --notes-file release-notes.txt --prerelease
