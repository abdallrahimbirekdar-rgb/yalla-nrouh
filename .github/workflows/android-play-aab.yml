name: Build signed Android App Bundle

on:
  push:
    branches: [play-first-bundle]

permissions:
  contents: read

jobs:
  play-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_VERSION_CODE: '44'
      BUNDLETOOL_VERSION: '1.18.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare first Play upload key and encrypted backup
        run: |
          set -euo pipefail
          umask 077
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          export PLAY_UPLOAD_STORE_PASSWORD="$password"
          mkdir -p "$RUNNER_TEMP/play-key" play-key-backup
          printf '%s\n' "$password" > "$RUNNER_TEMP/play-key/password.txt"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/play-key/yalla-nrouh-upload.p12" \
            -storepass:env PLAY_UPLOAD_STORE_PASSWORD -alias yalla-nrouh-upload -keyalg RSA -keysize 3072 \
            -validity 10000 -dname 'CN=Yalla Nrouh Upload'
          keytool -exportcert -rfc -keystore "$RUNNER_TEMP/play-key/yalla-nrouh-upload.p12" \
            -storepass:env PLAY_UPLOAD_STORE_PASSWORD -alias yalla-nrouh-upload -file play-key-backup/yalla-nrouh-upload-certificate.pem
          tar -C "$RUNNER_TEMP/play-key" -czf - password.txt yalla-nrouh-upload.p12 | \
            openssl cms -encrypt -binary -aes256 -outform DER -out play-key-backup/yalla-nrouh-upload-backup.cms .github/play-backup-transport.pem
          printf 'PLAY_UPLOAD_STORE_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          node scripts/prepare-play-config.cjs
          node -e 'const fs=require("fs");const p=require("./app.json");p.expo.android.package="com.yallanrouh";fs.writeFileSync("app.json",JSON.stringify(p,null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: yalla-nrouh-encrypted-key-backup
          path: play-key-backup/
          if-no-files-found: error
          retention-days: 14
      - name: Install Android tooling
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          curl -fsSLo "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build with Play upload key
        working-directory: android
        run: |
          keystore="$RUNNER_TEMP/play-key/yalla-nrouh-upload.p12"
          ./gradlew :app:bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2 \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$PLAY_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="yalla-nrouh-upload" \
            -Pandroid.injected.signing.key.password="$PLAY_UPLOAD_STORE_PASSWORD"
      - name: Verify signature, permissions, target API and native alignment
        run: |
          set -euo pipefail
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/play-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/play-signature.txt"
          expected=$(keytool -exportcert -keystore "$RUNNER_TEMP/play-key/yalla-nrouh-upload.p12" -storepass:env PLAY_UPLOAD_STORE_PASSWORD -alias "yalla-nrouh-upload" | sha256sum | cut -d' ' -f1)
          actual=$(keytool -printcert -rfc -jarfile "$bundle" | openssl x509 -outform der | sha256sum | cut -d' ' -f1)
          test "$expected" = "$actual"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" > "$RUNNER_TEMP/play-manifest.xml"
          python3 scripts/verify-play-bundle.py "$bundle" "$RUNNER_TEMP/play-manifest.xml" \
            "$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p play-release
          cp "$bundle" play-release/yalla-nrouh.aab
          cp android/app/build/outputs/mapping/release/mapping.txt play-release/
          (cd play-release && sha256sum yalla-nrouh.aab > yalla-nrouh.aab.sha256)
      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/play-key"
      - uses: actions/upload-artifact@v4
        with:
          name: yalla-nrouh-play-44
          path: play-release/
          if-no-files-found: error
          retention-days: 14
