name: Build signed Android App Bundle

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Unique Play version code (greater than the current test code and every uploaded Play code)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  play-aab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAY_VERSION_CODE: ${{ inputs.version_code }}
      BUNDLETOOL_VERSION: '1.18.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check release configuration
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the repository Actions secret $name before building a Play bundle."
              exit 1
            fi
          done
          node scripts/prepare-play-config.cjs
      - name: Install Android tooling
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          curl -fsSLo "$RUNNER_TEMP/bundletool.jar" "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build with Play upload key
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        working-directory: android
        run: |
          umask 077
          keystore="$RUNNER_TEMP/yalla-play-upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          ./gradlew :app:bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2 \
            -Pandroid.injected.signing.store.file="$keystore" \
            -Pandroid.injected.signing.store.password="$PLAY_UPLOAD_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$PLAY_UPLOAD_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$PLAY_UPLOAD_KEY_PASSWORD"
      - name: Verify signature, permissions, target API and native alignment
        env:
          PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" | tee "$RUNNER_TEMP/play-signature.txt"
          grep -Fq 'jar verified.' "$RUNNER_TEMP/play-signature.txt"
          expected=$(keytool -exportcert -keystore "$RUNNER_TEMP/yalla-play-upload.jks" -storepass:env PLAY_UPLOAD_STORE_PASSWORD -alias "$PLAY_UPLOAD_KEY_ALIAS" | sha256sum | cut -d' ' -f1)
          actual=$(keytool -printcert -rfc -jarfile "$bundle" | openssl x509 -outform der | sha256sum | cut -d' ' -f1)
          test "$expected" = "$actual"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$bundle"
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$bundle" > "$RUNNER_TEMP/play-manifest.xml"
          python3 scripts/verify-play-bundle.py "$bundle" "$RUNNER_TEMP/play-manifest.xml" \
            "$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          mkdir -p play-release
          cp "$bundle" play-release/yalla-nrouh.aab
          cp android/app/build/outputs/mapping/release/mapping.txt play-release/
          (cd play-release && sha256sum yalla-nrouh.aab > yalla-nrouh.aab.sha256)
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/yalla-play-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: yalla-nrouh-play-${{ inputs.version_code }}
          path: play-release/
          if-no-files-found: error
          retention-days: 14
