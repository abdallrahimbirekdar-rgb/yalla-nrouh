name: Deploy Yalla Nrouh web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yalla-nrouh-pages
  cancel-in-progress: true

jobs:
  deploy:
    env:
      EXPO_PUBLIC_GOOGLE_MAPS_WEB_API_KEY: ${{ secrets.GOOGLE_MAPS_WEB_API_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_WEB_MAP_ID: ${{ vars.GOOGLE_MAPS_WEB_MAP_ID }}
      EXPO_PUBLIC_GOOGLE_ROUTES_PROXY: ${{ vars.GOOGLE_ROUTES_PROXY_URL }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Export website for GitHub Pages
        run: node scripts/export-github-pages.cjs
      - name: Retain recently published assets for cached pages
        run: node scripts/retain-web-assets.cjs
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          keep_files: true
          enable_jekyll: false
