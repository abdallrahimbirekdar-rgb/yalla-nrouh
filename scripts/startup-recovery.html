<style>body{margin:0}#yn-startup{position:fixed;inset:56px 0 0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#fff;color:#202529;font:16px/1.9 Arial,sans-serif;padding:24px;text-align:center}html.yn-native-app #yn-startup{top:0}#yn-startup button{padding:12px 22px;border:0;border-radius:12px;background:#202529;color:#fff;font-size:16px;cursor:pointer;margin-top:12px}</style>
<div id="yn-startup" dir="rtl" role="status"><div><strong>يلا نروح</strong><p id="yn-startup-message">جارٍ فتح التطبيق…</p><button id="yn-startup-retry" style="display:none" onclick="window.location.reload()">إعادة المحاولة</button></div></div>
<script>(function(){var root=document.getElementById('root'),box=document.getElementById('yn-startup');if(!root||!box)return;var timer=setTimeout(function(){var message=document.getElementById('yn-startup-message'),retry=document.getElementById('yn-startup-retry');if(message)message.textContent='تأخر فتح التطبيق. تحقق من اتصال الإنترنت ثم أعد المحاولة. بياناتك المحفوظة تبقى على الجهاز.';if(retry)retry.style.display='inline-block';},12000);var observer=new MutationObserver(function(){if(root.children.length){clearTimeout(timer);box.remove();observer.disconnect();}});observer.observe(root,{childList:true});if(root.children.length){clearTimeout(timer);box.remove();observer.disconnect();}})();</script>
