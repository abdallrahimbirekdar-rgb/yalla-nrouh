<style>body{margin:0}#yn-startup{position:fixed;inset:56px 0 0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#edf3fb;color:#082648;font:16px/1.9 Arial,sans-serif;padding:24px;text-align:center}html.yn-native-app #yn-startup{top:0}#yn-startup button{padding:12px 22px;border:0;border-radius:12px;background:#082648;color:#fff;font-size:16px;cursor:pointer;margin-top:12px}</style>
<div id="yn-startup" dir="rtl" role="status"><div><strong id="yn-startup-brand">يلّا نروح</strong><p id="yn-startup-message">جارٍ فتح التطبيق…</p><button id="yn-startup-retry" style="display:none" onclick="window.location.reload()">إعادة المحاولة</button></div></div>
<script>
(function(){
 var root=document.getElementById('root'),box=document.getElementById('yn-startup');
 if(!root||!box)return;
 var lang=document.documentElement.lang;
 var text={
  ar:['يلّا نروح','جارٍ فتح التطبيق…','إعادة المحاولة','تأخر فتح التطبيق. تحقق من اتصال الإنترنت ثم أعد المحاولة. بياناتك المحفوظة تبقى على الجهاز.'],
  de:['Yalla Nrouh','App wird geöffnet …','Erneut versuchen','Die App braucht länger zum Starten. Prüfe die Internetverbindung und versuche es erneut. Deine gespeicherten Daten bleiben auf dem Gerät.'],
  en:['Yalla Nrouh','Opening the app…','Try again','The app is taking longer to open. Check your internet connection and try again. Your saved data stays on this device.']
 }[lang]||null;
 var message=document.getElementById('yn-startup-message'),retry=document.getElementById('yn-startup-retry');
 if(text){
  box.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('yn-startup-brand').textContent=text[0];
  message.textContent=text[1];
  retry.textContent=text[2];
 }
 var timer=setTimeout(function(){
  if(text)message.textContent=text[3];
  retry.style.display='inline-block';
 },12000);
 function dismiss(){if(root.children.length){clearTimeout(timer);box.remove();observer.disconnect();}}
 var observer=new MutationObserver(dismiss);
 observer.observe(root,{childList:true});
 dismiss();
})();
</script>
