  <div class="yn-card">
   <strong id="yn-startup-brand">يلّا نروح</strong>
   <div role="status">
    <p id="yn-startup-message">لحظات ونكون جاهزين…</p>
    <p id="yn-startup-detail">جارٍ تجهيز واجهة التطبيق</p>
   </div>
   <div id="yn-startup-dots" aria-hidden="true"><i></i><i></i><i></i></div>
   <button type="button" id="yn-startup-retry" hidden onclick="window.location.reload()">إعادة المحاولة</button>
  </div>

<script>
(function(){
 var root=document.getElementById('root'),box=document.getElementById('yn-startup');
 if(!root||!box)return;
 var lang=document.documentElement.lang;
 var messages={
  ar:['يلّا نروح','لحظات ونكون جاهزين…','جارٍ تجهيز واجهة التطبيق','إعادة المحاولة','تأخر فتح التطبيق. تحقق من اتصال الإنترنت ثم أعد المحاولة. بياناتك المحفوظة تبقى على الجهاز.'],
  de:['Yalla Nrouh','Gleich geht’s los …','Die App wird vorbereitet','Erneut versuchen','Die App braucht länger zum Starten. Prüfe die Internetverbindung und versuche es erneut. Deine gespeicherten Daten bleiben auf dem Gerät.'],
  en:['Yalla Nrouh','Ready in a moment…','Preparing the app','Try again','The app is taking longer to open. Check your internet connection and try again. Your saved data stays on this device.']
 };
 var text=messages[lang]||messages.ar;
 var message=document.getElementById('yn-startup-message'),detail=document.getElementById('yn-startup-detail');
 var retry=document.getElementById('yn-startup-retry'),dots=document.getElementById('yn-startup-dots');
 if(text){
  box.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('yn-startup-brand').textContent=text[0];
  message.textContent=text[1];
  detail.textContent=text[2];
  retry.textContent=text[3];
 }
 var timer=setTimeout(function(){
  message.textContent=text[4];
  detail.hidden=true;
  dots.hidden=true;
  retry.hidden=false;
 },12000);
 function dismiss(){if(root.children.length){clearTimeout(timer);box.remove();observer.disconnect();}}
 var observer=new MutationObserver(dismiss);
 observer.observe(root,{childList:true});
 dismiss();
})();
</script>
